<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein safety design</title>
  
  <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Roboto:300,400,500,700" type="text/css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <style type="text/css">
    .select {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col s11">
        <h2>Protein design biosafety</h2>
      </div>
    </div>
    <form>
      <div class="row">
        <div class="col s12 center-align">
          {{ form.file }}
        </div>
      </div>
      <div class="row">
        <div class="col s4">
          <h4>Mandatory</h4>
            {{ form.mandatory_parameters }}
        </div>
        <div class="col s7">
          <h4>Filtering</h4>
          {{ form.filtering_parameters }}
        </div>
      </div>
      <div class="row">
        <div class="col s12 center-align">
          {{ form.submit }}
        </div>
      </div>
    </form>
  </div>
  
</body>
</html>
