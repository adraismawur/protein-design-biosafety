{% extends 'base.html' %}

{% block body %}
<div class="container">
  <div class="row">
    <div class="col s11">
      <h2>Protein design biosafety</h2>
    </div>
  </div>
  <form method="post">
    <div class="row">
      <div class="col s12 center-align">
        {{ form.file }}
      </div>
    </div>
    <div class="row">
      <div class="col s4">
        <h4>Mandatory</h4>
        {{ form.mandatory_parameters }}
      </div>
      <div class="col s7">
        <h4>Filtering</h4>
        {{ form.filtering_parameters }}
      </div>
    </div>
    <div class="row">
      <div class="col s12 center-align">
        {{ form.submit }}
      </div>
    </div>
  </form>
</div>
{% endblock %}
